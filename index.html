<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141414" />
    <title>WorkGames</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="src/styles/app.css" />

    <!--
      Plain scripts (not ES modules) so this page works when opened straight from disk.
      Order matters: each file adds to window.WorkGames and later files use earlier ones.
      Individual games (games/<id>/game.js) are loaded on demand when you press Play.
    -->
    <script defer src="games/registry.js"></script>
    <script defer src="src/dom.js"></script>
    <script defer src="src/store.js"></script>
    <script defer src="src/catalog.js"></script>
    <script defer src="src/router.js"></script>
    <script defer src="src/components/buttons.js"></script>
    <script defer src="src/components/details.js"></script>
    <script defer src="src/components/preview.js"></script>
    <script defer src="src/components/row.js"></script>
    <script defer src="src/components/hero.js"></script>
    <script defer src="src/components/nav.js"></script>
    <script defer src="src/views/home.js"></script>
    <script defer src="src/views/player.js"></script>
    <script defer src="games/_shared/coming-soon.js"></script>
    <script defer src="src/main.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript><p style="padding: 2rem">WorkGames needs JavaScript enabled.</p></noscript>
  </body>
</html>
